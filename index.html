<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2436">
<title>Inkwell</title>
<style>
:root{--paper:#EDE8D0;--pl:#2a4a7a66;--ui:#F6F2E0;--bd:#cfc8aa;--fg:#2b2820;--txt:#1d1b16;--acc:#e0562d;--iz:1;--tk:#a626a4;--ts:#3f8a3d;--tc:#8a8f98;--tn:#b07a00;--tf:#3f6fd8}
:root[data-theme=dark]{--paper:#161513;--pl:#ffffff3a;--ui:#22201c;--bd:#3b3830;--fg:#ece7d6;--txt:#efe9d8;--tk:#c678dd;--ts:#98c379;--tc:#7f848e;--tn:#d19a66;--tf:#61afef}
*{box-sizing:border-box}
html.tt,html.tt *,html.tt *::before,html.tt *::after{transition:background-color .45s ease,color .45s ease,border-color .45s ease,box-shadow .45s ease,fill .45s ease,stroke .45s ease,outline-color .45s ease!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper);color:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
body.select #cv,body.auto #cv{cursor:default}body.er #cv,body.pen #cv,body.hl #cv{cursor:none}
#layer{position:fixed;left:0;top:0;transform-origin:0 0;pointer-events:none}
#ecur{position:fixed;display:none;z-index:9;pointer-events:none;border:1.5px solid var(--fg);border-radius:50%;box-shadow:0 0 0 1px var(--paper)}
.note{position:absolute;display:flex;flex-direction:column;overflow:hidden;pointer-events:none}
body.text .note{pointer-events:auto;outline:calc(1px*var(--iz)) dashed color-mix(in srgb,var(--acc) 45%,transparent)}
.note.editing{pointer-events:auto}
body.auto.text .note{pointer-events:none;outline:none}body.auto.text .note.editing{pointer-events:auto}
.body,.view{flex:1;padding:6px 8px;overflow:hidden;line-height:1.45;overflow-wrap:anywhere;tab-size:4}
.body{outline:none;white-space:pre-wrap;caret-color:var(--acc);-webkit-user-select:text;user-select:text}
.body::selection{background:color-mix(in srgb,var(--acc) 35%,transparent);color:inherit}
.view{display:none}.note.rend .body{display:none}.note.rend .view{display:block}
.view p{margin:.25em 0}.view h1,.view h2,.view h3,.view h4{margin:.3em 0;line-height:1.2}
.view h1{font-size:1.7em}.view h2{font-size:1.4em}.view h3{font-size:1.15em}.view h4{font-size:1em}
.view ul,.view ol{margin:.25em 0;padding-left:1.4em}
.view blockquote{margin:.3em 0;padding-left:.7em;border-left:3px solid var(--acc);opacity:.85}
.view code,.view pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:color-mix(in srgb,var(--txt) 9%,transparent);border-radius:4px}
.view code{padding:1px 4px}.view pre{padding:8px 10px;margin:.3em 0;white-space:pre;overflow:hidden}.view pre code{background:none;padding:0}
.view hr{border:0;border-top:1px solid var(--bd)}.view a{color:var(--acc)}.view .m[data-d]{display:block;text-align:center;margin:.3em 0}
.tk{color:var(--tk)}.ts{color:var(--ts)}.tc{color:var(--tc);font-style:italic}.tn{color:var(--tn)}.tf{color:var(--tf)}
/* selection frame */
#sf{position:absolute;left:0;top:0;transform-origin:0 0;display:none;z-index:5;border:calc(1.5px*var(--iz)) dashed var(--acc);pointer-events:none}
#sf .e{position:absolute;pointer-events:auto;cursor:move;touch-action:none}
#sf .t,#sf .b{left:0;right:0;height:calc(14px*var(--iz))}#sf .t{top:calc(-7px*var(--iz))}#sf .b{bottom:calc(-7px*var(--iz))}
#sf .l,#sf .r{top:0;bottom:0;width:calc(14px*var(--iz))}#sf .l{left:calc(-7px*var(--iz))}#sf .r{right:calc(-7px*var(--iz))}
#sf .h{position:absolute;width:calc(12px*var(--iz));height:calc(12px*var(--iz));background:var(--acc);transform:translate(-50%,-50%);pointer-events:auto;touch-action:none}
#sf .h::after{content:"";position:absolute;inset:calc(-10px*var(--iz))}
#sf .nw{left:0;top:0;cursor:nwse-resize}#sf .ne{left:100%;top:0;cursor:nesw-resize}#sf .se{left:100%;top:100%;cursor:nwse-resize}#sf .sw{left:0;top:100%;cursor:nesw-resize}
#sf .rot{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;pointer-events:none}
#sf.sh .rot{display:flex}
#sf .knob{width:calc(28px*var(--iz));height:calc(28px*var(--iz));border:calc(2px*var(--iz)) solid var(--acc);border-radius:50%;background:var(--paper);color:var(--acc);display:grid;place-items:center;pointer-events:auto;cursor:grab;touch-action:none}
#sf .knob svg{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;pointer-events:none}
#sf .stem{width:calc(2px*var(--iz));height:calc(20px*var(--iz));background:repeating-linear-gradient(var(--acc) 0 calc(5px*var(--iz)),transparent 0 calc(9px*var(--iz)))}
/* chrome */
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.ic{--cut:currentColor;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;display:block}
.on .ic{fill:currentColor;--cut:var(--ui)}
#top{position:fixed;left:0;right:0;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(46px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;background:var(--ui);border-bottom:1px solid var(--bd)}
#brand{font:italic 700 22px Georgia,serif}.grp{display:flex;gap:2px}.grp:last-child{justify-self:end}
#top button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.panel{position:fixed;z-index:10;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--ui);border:1px solid var(--bd);box-shadow:0 4px 18px #0002;top:50%;transform:translateY(-50%)}
#tools{left:0;padding:16px 8px;border-left:0;border-radius:0 32px 32px 0}#side{right:12px;border-radius:26px}
.panel button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
body:not(.text) .txt{display:none}
body.select #bs,body.select #bo,body.er #bo,body.er #bc{display:none}
.dot{display:block;width:28px;height:28px;border-radius:50%;border:2px solid var(--fg);--u:8px}
.dot.op{background:rgba(255,255,255,.5)}
.pop{position:fixed;z-index:20;display:none;background:var(--ui);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:0 6px 24px #0003}
.pop.open{display:block}
.pv{display:flex;align-items:center;justify-content:center;flex:none;width:130px;height:130px;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:conic-gradient(#8883 25%,transparent 0 50%,#8883 0 75%,transparent 0) 0 0/14px 14px;-webkit-user-select:none}
.pv.w{width:100%;height:76px;margin-bottom:10px}.pv i{flex:none;display:block}
#sw{display:grid;grid-template-columns:repeat(10,26px);gap:6px}
.swb{width:26px;height:26px;border-radius:50%;border:1px solid #0004!important}.swb.on{outline:2px solid var(--fg);outline-offset:2px}
#wh{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
#wheel{width:150px;height:150px;touch-action:none;cursor:crosshair}
#wb{position:relative;width:150px;height:150px}#wm{position:absolute;display:none;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #000a,inset 0 0 0 1px #0006;pointer-events:none}#val,#ov{width:200px;accent-color:var(--acc)}
#psz.open{display:flex;align-items:center;gap:14px}#psz .srow{display:flex;align-items:center;gap:6px}
#psz button{width:44px;height:44px;border-radius:50%;font-size:24px;border:1px solid var(--bd)}
#sv{width:84px;height:44px;text-align:center;font-size:18px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--fg);-webkit-user-select:text;user-select:text;-moz-appearance:textfield}
#sv::-webkit-inner-spin-button{display:none}
#po .r{display:flex;align-items:center;gap:10px}#ol{min-width:44px;text-align:right}
#pf{width:240px}#pf button{display:block;width:100%;padding:9px 14px;border-radius:10px;text-align:left;font-size:20px}#pf button.on,#ptx button.on,#psh2 button.on{background:var(--bd)}
#ptx button,#pex button{display:block;width:210px;text-align:left;padding:10px 14px;border-radius:10px;font-size:17px}#ptx small,#pex small{display:block;opacity:.65;font-size:12px}
#psh button{display:flex;align-items:center;gap:12px;width:140px;padding:8px 12px;border-radius:10px;font-size:16px}
#psh2.open{display:grid;grid-template-columns:repeat(4,52px);gap:6px}#psh2 button{width:52px;height:52px;border-radius:12px;display:grid;place-items:center}
#pp.open{display:grid;grid-template-columns:repeat(2,auto);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:12px}.tile.on{outline:2px solid var(--fg)}
.tile i{display:block;width:104px;height:72px;border-radius:8px;border:1px solid var(--bd);--u:14px}.tile span{font-size:12px}
.pp,.tile i{background-color:var(--paper)}
.p-paper,.p-paperL{background-image:linear-gradient(var(--pl) 1px,transparent 1px)}.p-paper{background-size:100% var(--u)}.p-paperL{background-size:100% calc(var(--u)*2)}
.p-grid,.p-gridL{background-image:linear-gradient(var(--pl) 1px,transparent 1px),linear-gradient(90deg,var(--pl) 1px,transparent 1px)}
.p-grid{background-size:var(--u) var(--u)}.p-gridL{background-size:calc(var(--u)*2) calc(var(--u)*2)}
.p-dots{background-image:radial-gradient(var(--pl) 1.4px,transparent 1.6px);background-size:var(--u) var(--u)}
#zc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px}
#zl{opacity:0;transition:opacity .25s;background:var(--ui);border:1px solid var(--bd);border-radius:12px;padding:3px 12px;font-variant-numeric:tabular-nums}#zl.show{opacity:1}
#fname{width:min(260px,60vw);height:38px;text-align:center;border-radius:19px;background:var(--ui);border:1px solid var(--bd);color:var(--fg);font:inherit;outline:none;-webkit-user-select:text;user-select:text}#fname:focus{border-color:var(--acc)}
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0006}#modal[hidden]{display:none}
.card{background:var(--ui);border:1px solid var(--bd);border-radius:20px;padding:18px 20px;width:min(440px,92vw);box-shadow:0 10px 40px #0005}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:20px;margin-bottom:8px}.mh button{width:40px;height:40px;font-size:26px}
.row small{display:block;opacity:.65;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:16px}
#asw{display:grid;grid-template-columns:repeat(10,26px);gap:6px;margin-bottom:8px}
input[type=checkbox]{accent-color:var(--acc);width:22px;height:22px}
#mq{position:fixed;z-index:6;display:none;border:1.5px dashed var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);pointer-events:none}
#mm{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mmc{width:180px;height:120px;border-radius:14px;border:1px solid var(--bd);box-shadow:0 4px 18px #0002;touch-action:none;cursor:pointer;background:var(--ui)}
#mmt{width:40px;height:40px;border-radius:50%;background:var(--ui);border:1px solid var(--bd);display:grid;place-items:center}
#toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:40;background:var(--ui);border:1px solid var(--bd);border-radius:14px;padding:6px 14px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}
.view table{border-collapse:collapse;margin:.3em 0}.view th,.view td{border:1px solid var(--bd);padding:3px 8px}.view th{background:color-mix(in srgb,var(--txt) 8%,transparent)}
.view li.task{list-style:none;margin-left:-1.2em}.view li>ul,.view li>ol{margin:0}.view input[type=checkbox]{accent-color:var(--acc);width:1em;height:1em;vertical-align:-.1em;margin-right:.3em}
</style>
</head>

<div id="layer"><div id="sf">
  <i class="e t" data-h="mv"></i><i class="e b" data-h="mv"></i><i class="e l" data-h="mv"></i><i class="e r" data-h="mv"></i>

<script>
/*PURE*/
const LINE=k=>k==='line'||k==='arrow'||k==='arrow2';
const dashA=(st,w)=>st==='dash'?[Math.max(w*3,8),Math.max(w*2.2,6)]:st==='dot'?[.01,Math.max(w*2.2,5)]:[];
function shapePolys(s){const{kind:k,st,w,h,size}=s,W=w/2,H=h/2,m=[],d=[],cl=(n,f)=>Array.from({length:n+1},(_,i)=>f(i,n)),PI=Math.PI;
  if(LINE(k)){const g=Math.max(size*1.4,3),hl=Math.min(12+size*2.5,w*.45),e=st==='double'?g/Math.tan(.5):0,x0=k==='arrow2'?-W+e:-W,x1=k==='line'?W:W-e;
    (st==='double'?[-g,g]:[0]).forEach(y=>m.push([[x0,y],[x1,y]]));
    const hd=q=>d.push([[q*(W-hl*Math.cos(.5)),-hl*Math.sin(.5)],[q*W,0],[q*(W-hl*Math.cos(.5)),hl*Math.sin(.5)]]);
    if(k!=='line')hd(1);if(k==='arrow2')hd(-1)}
  else if(k==='ellipse')m.push(cl(72,(i,n)=>[Math.cos(i/n*2*PI)*W,Math.sin(i/n*2*PI)*H]));
  else if(k==='rect')m.push([[-W,-H],[W,-H],[W,H],[-W,H],[-W,-H]]);

    if(!s.isCollapsed){e.preventDefault();const tx=s.toString();document.execCommand('insertText',false,e.key+tx+c);s.modify('move','backward','character');for(let i=0;i<tx.length;i++)s.modify('extend','backward','character')}
    else if(S.opt.pair&&'([{"`'.includes(e.key)){e.preventDefault();document.execCommand('insertText',false,e.key+c);s.modify('move','backward','character')}};
  layer.appendChild(n);refresh();return b}
function addText(x,y,w=260,h=80,focus=true){const t={x:Math.round(x),y:Math.round(y),w,h,text:'',fs:SZ.text,font:fi,color,al:AL.text/100,mode:tmode};S.texts.push(t);const b=mkNote(t);if(focus)setTimeout(()=>b.focus(),30);return{t,b}}
function startEdit(t,e){const n=EL.get(t),b=n.querySelector('.body');n.classList.remove('rend');n.classList.add('editing');b.focus();
  let r=document.caretRangeFromPoint?.(e.clientX,e.clientY);
  if(!r&&document.caretPositionFromPoint){const c=document.caretPositionFromPoint(e.clientX,e.clientY);if(c){r=document.createRange();r.setStart(c.offsetNode,c.offset)}}
  const s=getSelection();s.removeAllRanges();
  if(r&&b.contains(r.startContainer)){r.collapse(true);s.addRange(r)}else{r=document.createRange();r.selectNodeContents(b);r.collapse(false);s.addRange(r)}}
function applySel(){if(!SEL)return;const{k,o}=SEL;
  if(k==='shape'&&(tool==='shape'||tool==='select')){o.color=color;if(tool==='shape'){o.size=SZ.shape/5;o.alpha=AL.shape/100}dirty=true;updFrame();save()}
  if(k==='note'&&(tool==='text'||tool==='select')){o.color=color;if(tool==='text'){o.fs=SZ.text;o.font=fi;o.al=AL.text/100;o.mode=tmode}styleNote(o);RF.get(o)();save()}}

/* ---------- UI ---------- */
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`,col=c=>c==='auto'?'conic-gradient(#111 50%,#f2efe6 0)':c;
const key=()=>tool in SZ?tool:'pen',cs=()=>SZ[key()],curAl=()=>AL[tool in AL?tool:'pen'];
const inkc=()=>color==='auto'?(tool==='hl'?'#ffe14d':dark()?'#f2efe6':'#1b1b1b'):color,title=()=>document.title=(S.name?S.name+' – ':'')+'Inkwell';
function shapeIcon(k,st){const l=LINE(k),P=shapePolys({kind:k,st,w:l?19:17,h:l?0:17,size:1.6}),f=v=>+v.toFixed(1),d=a=>a.map(pl=>'M'+pl.map(q=>q.map(f).join(' ')).join('L')).join(''),da=st==='dash'?'4 3':st==='dot'?'.1 3.2':'';
  return`<svg class="ic" viewBox="-12 -12 24 24"><g${l?' transform="rotate(-45)"':''}><path d="${d(P.m)}"${da?` stroke-dasharray="${da}"`:''}/>${P.d.length?`<path d="${d(P.d)}"/>`:''}</g></svg>`}
function pvStyle(){const a=curAl()/100,c=inkc();
  if(tool==='text')return`<span style="font:${Math.min(SZ.text,44)}px/1 ${FONTS[tmode==='code'?2:fi]};color:${c};opacity:${a}">Aa</span>`;
  const w=Math.min(30,Math.max(4,cs()/(tool==='hl'?1:5)));
  return`<svg viewBox="0 0 120 50" width="120" height="50"><path d="M8 34C28 6 44 6 60 28S92 48 112 14" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${a}"/></svg>`}
function pvSize(){const c=inkc(),a=curAl()/100;
  if(tool==='text')return`<span style="font:${SZ.text}px/1 ${FONTS[tmode==='code'?2:fi]};color:${c};opacity:${a}">Aa</span>`;
  if(tool==='er')return`<i style="width:${SZ.er}px;height:${SZ.er}px;border:2px solid var(--fg);border-radius:50%"></i>`;
  if(tool==='shape')return`<i style="width:64px;height:64px;border:${SZ.shape/5}px solid ${c};opacity:${a};border-radius:50%"></i>`;
  const d=tool==='hl'?SZ.hl:SZ.pen/5;return`<i style="width:${d}px;height:${d}px;border-radius:50%;background:${c};opacity:${a}"></i>`}
function sync(){const R=document.documentElement;R.dataset.theme=S.theme;R.style.setProperty('--acc',S.accent);document.body.className=tool+(autoSel?' auto':'');
  if(SEL&&!(SEL.k==='note'?(tool==='text'||tool==='select'):SEL.k==='shape'?(tool==='shape'||tool==='select'):tool==='select'))desel();
  if(!CUR())ec.style.display='none';
  const on=(sel,k,val)=>document.querySelectorAll(sel).forEach(b=>b.classList.toggle('on',b.dataset[k]==val));
  on('[data-t]','t',tool);on('[data-p]','p',S.bg);on('[data-f]','f',fi);on('[data-c]','c',color);on('[data-a]','a',S.accent);on('[data-m]','m',tmode);
  document.querySelectorAll('[data-so]').forEach(b=>b.classList.toggle('on',b.dataset.so===shp.kind+'|'+shp.st));
  $('#tshape').innerHTML=shapeIcon(shp.kind,shp.st);
  $('#bc i').style.background=inkc();
  {const wm=$('#wm');if(wheelUsed&&color===hex()){const a=hsv[0]*Math.PI/180,r=hsv[1]*75;wm.style.cssText=`display:block;left:${75+Math.cos(a)*r}px;top:${75+Math.sin(a)*r}px`}else wm.style.display='none'}
  $('#bp i').className='dot pp p-'+S.bg;$('#bm').innerHTML=ic(dark()?'moon':'sun');
  $('#sv').value=cs();$('#bs').textContent=cs();$('#bf').style.fontFamily=FONTS[tmode==='code'?2:fi];
  $('#ov').value=curAl();$('#ol').textContent=curAl()+'%';
  document.querySelectorAll('.pv.w').forEach(e=>e.innerHTML=pvStyle());$('#pvs').innerHTML=pvSize();dirty=true}
const closeAll=()=>document.querySelectorAll('.pop').forEach(p=>p.classList.remove('open'));
function pop(id,btn,side,keep){const p=$('#'+id),was=p.classList.contains('open');document.querySelectorAll('.pop').forEach(q=>{if(q.id!==keep)q.classList.remove('open')});if(was&&!keep)return;p.classList.add('open');
  const r=btn.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;
  p.style.left=Math.max(8,side==='r'?r.right+10:r.left-10-w)+'px';p.style.top=Math.max(56,Math.min(r.top+r.height/2-h/2,innerHeight-h-70))+'px'}
let sw=0;
document.addEventListener('pointerdown',e=>{if(e.target.closest('.pop,.panel'))return;if(document.querySelector('.pop.open')){closeAll();e.stopPropagation();e.preventDefault();sw=performance.now()+700}},true);
document.addEventListener('click',e=>{if(sw>performance.now()&&!e.target.closest('.pop,.panel')){e.stopPropagation();e.preventDefault();sw=0}},true);
const open=id=>$('#'+id).classList.contains('open');
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=b.dataset.t,was=tool===t&&(open('psh')||open('psh2')||open('ptx'));tool=t;autoSel=false;closeAll();sync();if(!was){if(t==='shape')pop('psh',b,'r');if(t==='text')pop('ptx',b,'r')}});
$('#ptx').onclick=e=>{const b=e.target.closest('[data-m]');if(b){tmode=b.dataset.m;closeAll();applySel();sync()}};
const OPTS={line:['solid','dash','dot','double'].map(s=>['line',s]),arrow:[...['solid','dash','dot','double'].map(s=>['arrow',s]),...['solid','dash','dot','double'].map(s=>['arrow2',s])],shape:['ellipse','tri','rect','pent','hex','dia','star','heart'].map(k=>[k,'solid'])};
$('#psh').innerHTML=[['line','Line','line'],['arrow','Arrow','arrow'],['shape','Shape','heart']].map(([c,n,k])=>`<button data-cat="${c}">${shapeIcon(k,'solid')}<span>${n}</span></button>`).join('');
$('#psh').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;$('#psh2').innerHTML=OPTS[b.dataset.cat].map(([k,s])=>`<button data-so="${k}|${s}" title="${k} ${s}">${shapeIcon(k,s)}</button>`).join('');sync();pop('psh2',$('#psh'),'r','psh')};
$('#psh2').onclick=e=>{const b=e.target.closest('[data-so]');if(b){[shp.kind,shp.st]=b.dataset.so.split('|');if(autoSel&&SEL&&SEL.k==='shape'){const o=SEL.o,wasL=LINE(o.kind);o.kind=shp.kind;o.st=shp.st;if(LINE(o.kind)&&!wasL)o.h=0;else if(!LINE(o.kind)&&wasL)o.h=Math.max(20,o.w*.6);dirty=true;updFrame();save()}closeAll();sync()}};
$('#pp').innerHTML=PAPERS.map(([k,n])=>`<button class="tile" data-p="${k}"><i class="p-${k}"></i><span>${n}</span></button>`).join('');
$('#pp').onclick=e=>{const b=e.target.closest('[data-p]');if(b){S.bg=b.dataset.p;closeAll();sync();save()}};
$('#fl').innerHTML=FN.map((n,i)=>`<button data-f="${i}" style="font-family:${FONTS[i]}">${n}</button>`).join('');
$('#fl').onclick=e=>{const b=e.target.closest('[data-f]');if(b){fi=+b.dataset.f;applySel();sync()}};
$('#bc').onclick=e=>pop('pc',e.currentTarget,'l');$('#bs').onclick=e=>pop('psz',e.currentTarget,'l');$('#bf').onclick=e=>pop('pf',e.currentTarget,'l');
$('#bo').onclick=e=>pop('po',e.currentTarget,'l');$('#bp').onclick=e=>pop('pp',e.currentTarget,'l');
$('#bm').onclick=()=>{const R=document.documentElement;R.classList.add('tt');S.theme=dark()?'light':'dark';themeTo();sync();save();setTimeout(()=>R.classList.remove('tt'),700)};
function setSize(v){SZ[key()]=Math.round(Math.min(110,Math.max(10,+v||10)));applySel();sync();save()}
const stp=()=>tool==='text'?2:5;$('#sm').onclick=()=>setSize(cs()-stp());$('#sp').onclick=()=>setSize(cs()+stp());
$('#sv').onchange=e=>setSize(e.target.value);$('#sv').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};
$('#ov').oninput=e=>{AL[tool in AL?tool:'pen']=+e.target.value;applySel();sync();save()};

/* colors */
const SW=['auto','#ffffff','#d0d0d0','#a0a0a0','#707070','#404040','#000000','#8b5a2b','#c9a66b','#f5deb3'];
for(const l of[38,55,72])for(let h=0;h<360;h+=36)SW.push(`hsl(${h} 70% ${l}%)`);
$('#sw').innerHTML=SW.map(c=>`<button class="swb" data-c="${c}" aria-label="${c}" style="background:${col(c)}"></button>`).join('');
function setColor(c){color=c;if(tool==='er')tool='pen';applySel();sync()}
$('#sw').onclick=e=>{const b=e.target.closest('[data-c]');if(b)setColor(b.dataset.c)};
const hsv=[0,0,1],wc=$('#wheel'),wx=wc.getContext('2d');let wd=false;
const hs=(h,s,v)=>{const f=n=>{const k=(n+h/60)%6;return Math.round(255*(v-v*s*Math.max(0,Math.min(k,4-k,1))))};return[f(5),f(3),f(1)]};
const hex=()=>'#'+hs(...hsv).map(v=>v.toString(16).padStart(2,'0')).join('');
function drawWheel(){const n=wc.width,r=n/2,im=wx.createImageData(n,n);for(let y=0;y<n;y++)for(let x=0;x<n;x++){const dx=x-r,dy=y-r,d=Math.hypot(dx,dy);if(d>r)continue;im.data.set([...hs((Math.atan2(dy,dx)*180/Math.PI+360)%360,d/r,hsv[2]),255],(y*n+x)*4)}wx.putImageData(im,0,0)}
const pickW=e=>{const r=wc.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;hsv[0]=(Math.atan2(dy,dx)*180/Math.PI+360)%360;hsv[1]=Math.min(1,Math.hypot(dx,dy)/(r.width/2));wheelUsed=true;setColor(hex())};
wc.onpointerdown=e=>{wc.setPointerCapture(e.pointerId);wd=true;pickW(e)};wc.onpointermove=e=>{if(wd)pickW(e)};wc.onpointerup=()=>wd=false;
$('#val').oninput=e=>{hsv[2]=e.target.value/100;drawWheel();wheelUsed=true;setColor(hex())};drawWheel();

/* settings */
$('#asw').innerHTML=SW.slice(1).map(c=>`<button class="swb" data-a="${c}" aria-label="${c}" style="background:${c}"></button>`).join('');
$('#asw').onclick=e=>{const b=e.target.closest('[data-a]');if(b){S.accent=b.dataset.a;sync();save()}};
$('#st').onclick=()=>{closeAll();document.querySelectorAll('[data-o]').forEach(i=>i.checked=!!S.opt[i.dataset.o]);$('#modal').hidden=false};
$('#mx').onclick=()=>$('#modal').hidden=true;$('#modal').onclick=e=>{if(e.target.id==='modal')e.target.hidden=true};
document.querySelectorAll('[data-o]').forEach(i=>i.onchange=()=>{S.opt[i.dataset.o]=i.checked?1:0;save()});

/* top bar + file name */
$('#un').onclick=doUndo;$('#re').onclick=doRedo;
$('#home').onclick=()=>{Object.assign(V(),{x:0,y:0,z:1});setView()};
$('#fname').oninput=e=>{S.name=e.target.value;title();save()};
$('#im').onclick=()=>$('#file').click();
function load(d){S=Object.assign(S,d);tv=tvB=dark()?1:0;S.sz=SZ=Object.assign(SZ,S.sz);S.al=AL=Object.assign(AL,S.al);S.opt=Object.assign({pressure:1,palm:1,pair:0,stylus:1,snap:1,gridsnap:0,guides:1},S.opt);S.accent=S.accent||'#e0562d';
  S.strokes=S.strokes.map(s=>s.tool==='shape'&&s.pts?{...s,tool:'poly',dash:null}:s);mmOn=S.mm!==false;mmc.style.display=mmOn?'block':'none';mmDirty=true;layer.querySelectorAll('.note').forEach(n=>n.remove());SEL=null;
  S.texts.forEach(t=>{t.mode=t.mode||'text';mkNote(t)});$('#fname').value=S.name||'';title()}
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!confirm('Replace the current canvas with this file?'))return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.strokes))throw 0;load(d);undo=[];redo=[];sync();setView()}catch{alert('That file is not an Inkwell backup.')}};

addEventListener('keydown',e=>{if(e.target.isContentEditable||e.target.tagName==='INPUT')return;
  if(e.code==='Space'){space=true;e.preventDefault()}
  if(e.key==='Escape')desel();
  if((e.key==='Delete'||e.key==='Backspace')&&SEL){e.preventDefault();delSel()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();doRedo()}});
addEventListener('keyup',e=>{if(e.code==='Space')space=false});
addEventListener('resize',resize);
(function loop(){if(tv!==tvB){const k=Math.min(1,(performance.now()-tvT)/450);tv=k>=1?tvB:tvA+(tvB-tvA)*(k*k*(3-2*k));dirty=true}if(dirty)render();if(mmOn&&mmDirty&&performance.now()-mmT>180){mmT=performance.now();mmDirty=false;mmDraw()}requestAnimationFrame(loop)})();

/* ---------- boot ---------- */
(async()=>{const d=await kvGet('doc');
  load(d||{texts:[{x:60,y:130,w:470,h:300,fs:20,font:0,color:'auto',al:1,mode:'md',text:'# Welcome to Inkwell\n\n**Select**: drag things to move them, double-tap a box to edit it.\n\n**Text**: drag to draw a box, then pick Text, Code or Markdown. Math works too: $E=mc^2$\n\nThe canvas never ends.'}]});
  resize();sync();setView();navigator.storage?.persist?.()})();
</script>
