/* v2: glass, motion, layout */

.tab.on{background:color-mix(in srgb,var(--fg) 12%,transparent)}
.rb{border-radius:14px}.rb:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}

body:not(.text) .txt,body:not(.img) #bim,body:not(.gph) #bgx,body.img #bc,body.gph #bc,body:not(.shape) .shp,body.ln .shp,body.select #bs,body.select #bo,body.er #bo,body.er #bc,body.lasso #bs,body.lasso #bo,body.lasso #bc{height:0;margin:-2px 0;opacity:0;transform:scale(.4);pointer-events:none;visibility:hidden}

const RND=["rect","tri","dia","pent","hex","star"];
function rnd(P,r){const n=P.length-1,o=[];for(let i=0;i<n;i++){const p=P[(i+n-1)%n],v=P[i],q=P[i+1];let ax=p[0]-v[0],ay=p[1]-v[1],bx=q[0]-v[0],by=q[1]-v[1];const la=Math.hypot(ax,ay),lb=Math.hypot(bx,by);if(!la||!lb){o.push(v);continue}ax/=la;ay/=la;bx/=lb;by/=lb;
  const th=Math.acos(Math.max(-1,Math.min(1,ax*bx+ay*by)));if(th<.001||th>Math.PI-.001){o.push(v);continue}const tn=Math.tan(th/2),t=Math.min(r/tn,la/2,lb/2),rr=t*tn;
  let mx=ax+bx,my=ay+by;const ml=Math.hypot(mx,my);mx/=ml;my/=ml;const d=rr/Math.sin(th/2),cx=v[0]+mx*d,cy=v[1]+my*d,a0=Math.atan2(v[1]+ay*t-cy,v[0]+ax*t-cx);let da=Math.atan2(v[1]+by*t-cy,v[0]+bx*t-cx)-a0;
  while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;for(let k=0;k<=8;k++){const a=a0+da*k/8;o.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr])}}o.push(o[0]);return o}
const LINE=k=>k==='line'||k==='arrow'||k==='arrow2';
const dashA=(st,w)=>st==='dash'?[Math.max(w*3,8),Math.max(w*2.2,6)]:st==='dot'?[.01,Math.max(w*2.2,5)]:[];
function shapePolys(s){const{kind:k,st,w,h,size,rad}=s,W=w/2,H=h/2,m=[],d=[],cl=(n,f)=>Array.from({length:n+1},(_,i)=>f(i,n)),PI=Math.PI;
  if(LINE(k)){const g=Math.max(size*1.4,3),hl=Math.min(12+size*2.5,w*.45),e=st==='double'?g/Math.tan(.5):0,x0=k==='arrow2'?-W+e:-W,x1=k==='line'?W:W-e;
    (st==='double'?[-g,g]:[0]).forEach(y=>m.push([[x0,y],[x1,y]]));
    const hd=q=>d.push([[q*(W-hl*Math.cos(.5)),-hl*Math.sin(.5)],[q*W,0],[q*(W-hl*Math.cos(.5)),hl*Math.sin(.5)]]);

  else if(k==='dia')m.push([[0,-H],[W,0],[0,H],[-W,0],[0,-H]]);
  else if(k==='pent'||k==='hex'){const n=k==='pent'?5:6;m.push(cl(n,i=>{const a=-PI/2+i*2*PI/n;return[Math.cos(a)*W,Math.sin(a)*H]}))}
  else if(k==='star')m.push(cl(10,i=>{const a=-PI/2+i*PI/5,r=i%2?.4:1;return[Math.cos(a)*r*W,Math.sin(a)*r*H]}));
  else if(k==='heart')m.push(cl(80,(i,n)=>{const t=i/n*2*PI,x=16*Math.sin(t)**3,y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);return[x/32*w,-(y+2.6)/28.8*h]}));
  if(rad>0&&RND.includes(k))m[0]=rnd(m[0],rad/100*Math.min(w,h)/2);
  return{m,d}}
const sd=(px,py,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((px-a[0])*dx+(py-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)};
function clip(P,cx,cy,r){const r2=r*r,n=P.length,ins=p=>(p[0]-cx)**2+(p[1]-cy)**2<r2,L=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,(a[2]??.5)+((b[2]??.5)-(a[2]??.5))*t];

const shiftS=(s,dx,dy)=>{if(s.tool==='shape'){s.cx+=dx;s.cy+=dy}else s.pts.forEach(q=>{q[0]+=dx;q[1]+=dy});if(s.bb)s.bb=[s.bb[0]+dx,s.bb[1]+dy,s.bb[2]+dx,s.bb[3]+dy]};
function moveG(dx,dy){G.s.forEach(s=>shiftS(s,dx,dy));G.t.forEach(t=>{t.x+=dx;t.y+=dy;place(t)});dirty=true;updG()}
function lassoDown(e,p){const[x,y]=world(e);if(G){const b=gBox(),m=8/V().z;if(x>=b[0]-m&&x<=b[2]+m&&y>=b[1]-m&&y<=b[3]+m){p.gd={x:e.clientX,y:e.clientY};return}}clearG();lp=[[x,y]]}
function lassoMove(e,p){if(p.gd){const z=V().z;moveG((e.clientX-p.gd.x)/z,(e.clientY-p.gd.y)/z);p.gd.x=e.clientX;p.gd.y=e.clientY}else{lp.push(world(e));vd=true}}
function lassoEnd(){const P=lp;lp=null;vd=true;if(P.length<8)return;const s=S.strokes.filter(s=>{const q=s.tool==='shape'?[[s.cx,s.cy]]:s.pts,m=Math.max(1,Math.ceil(q.length/30));let a=0,n=0;for(let i=0;i<q.length;i+=m){n++;if(pip(q[i][0],q[i][1],P))a++}return a>0&&a*2>=n}),t=S.texts.filter(t=>pip(t.x+t.w/2,t.y+t.h/2,P));G=s.length||t.length?{s,t}:null;updG()}
function delG(){undo.push({rem:G.s,trem:G.t});redo=[];S.strokes=S.strokes.filter(s=>!G.s.includes(s));S.texts=S.texts.filter(t=>!G.t.includes(t));G.t.forEach(t=>{const n=EL.get(t);n&&n.remove()});clearG();dirty=true;save()}
function dupG(){const ns=G.s.map(s=>{const c=structuredClone(s);shiftS(c,24,24);return c}),nt=G.t.map(t=>{const c=structuredClone(t);c.x+=24;c.y+=24;return c});S.strokes.push(...ns);nt.forEach(c=>{S.texts.push(c);mkNote(c)});undo.push({rem:[],add:ns,tadd:nt});redo=[];G={s:ns,t:nt};dirty=true;updG();save()}
const SSd=()=>(S.lay||{}).s==='r'?'l':'r',TSd=()=>(S.lay||{}).t==='l'?'r':'l';
function moveInd(an){const b=document.querySelector('#tools [data-t].on'),i=$('#tools .ind');if(!b||!b.offsetHeight)return;const y=b.offsetTop,h=b.offsetHeight;i.style.opacity=1;i.style.left=b.offsetLeft+'px';i.style.width=b.offsetWidth+'px';
  if(indY===null||!an){i.style.top=y+'px';i.style.height=h+'px';indY=y;return}
  if(y===indY){i.style.height=h+'px';return}
  const a=indY;i.getAnimations().forEach(x=>x.cancel());i.animate([{top:a+'px',height:h+'px'},{top:Math.min(a,y)+'px',height:Math.abs(y-a)+h+'px',offset:.45},{top:y+'px',height:h+'px'}],{duration:480,easing:'cubic-bezier(.3,.8,.2,1)'});
  i.style.top=y+'px';i.style.height=h+'px';indY=y}
function applyLayout(an){const R=document.documentElement,L=S.lay=Object.assign({t:'l',s:'r',m:'br',ts:1,ss:1,ms:1},S.lay);R.dataset.lt=L.t;R.dataset.ls=L.s;R.dataset.lm=L.m;
  R.style.setProperty('--tsz',L.ts);R.style.setProperty('--ssz',L.ss);R.style.setProperty('--msz',L.ms);R.style.setProperty('--ga',S.ga??50);R.style.setProperty('--rf',S.rf??50);
  R.style.setProperty('--so',L.t===L.s?($('#tools .tb').offsetWidth+8)+'px':'0px');moveInd(an)}
document.querySelectorAll('[data-gl]').forEach(i=>i.oninput=()=>{S[i.dataset.gl]=+i.value;applyLayout(0);save()});
function lyDraw(){const L=S.lay,sg=(k,o)=>`<div class="seg">${o.map(([v,t])=>`<button data-ly="${k}" data-v="${v}" class="${L[k]===v?'on':''}">${t}</button>`).join('')}</div>`,rg=(k,t)=>`<label class="lyr"><span>${t}</span><input type="range" min="70" max="140" value="${L[k]*100}" data-lr="${k}"></label>`;
  $('#play').innerHTML=`<div class="lyt">Tools bar</div>${sg('t',[['l','Left'],['r','Right']])}<div class="lyt">Options bar</div>${sg('s',[['l','Left'],['r','Right']])}<div class="lyt">Map</div><div class="seg cg">${[['tl','↖'],['tr','↗'],['bl','↙'],['br','↘']].map(([v,t])=>`<button data-ly="m" data-v="${v}" class="${L.m===v?'on':''}">${t}</button>`).join('')}</div>${rg('ts','Tools size')}${rg('ss','Options size')}${rg('ms','Map size')}`}
$('#bly').onclick=e=>{lyDraw();pop('play',e.currentTarget,'b')};
$('#play').addEventListener('click',e=>{const b=e.target.closest('[data-ly]');if(!b)return;flip(()=>{S.lay[b.dataset.ly]=b.dataset.v;applyLayout(0)});lyDraw();save()});
$('#play').addEventListener('input',e=>{const k=e.target.dataset.lr;if(k){S.lay[k]=e.target.value/100;applyLayout(0);save()}});
/* background colour (per theme) + left bar proximity reveal */
const BGP={light:['#EDE8D0','#ffffff','#f6f3ea','#e4ecf6','#e5eedf','#f6e4e4','#fbf0c4','#d9d3bd'],dark:['#161513','#000000','#181d2b','#12201a','#231a2a','#2b1c1c','#262626','#0d1620']};
function bgDraw(){const c=bgOf(S.theme);$('#pbg').innerHTML=`<div id="bgs">${BGP[S.theme].map(h=>`<button class="swb${h.toLowerCase()===c.toLowerCase()?' on':''}" data-bg="${h}" aria-label="${h}" style="background:${h}"></button>`).join('')}</div><label class="bgc"><span>Custom</span><input type="color" id="bgi" value="${c}"></label><button id="bgr">Reset to default</button>`}
const setBg=c=>{S.bgc=S.bgc||{};if(c)S.bgc[S.theme]=c;else delete S.bgc[S.theme];sync();save()};
$('#bgc').onclick=e=>{bgDraw();pop('pbg',e.currentTarget,'b')};
$('#pbg').addEventListener('click',e=>{const b=e.target.closest('[data-bg]');if(b){setBg(b.dataset.bg);bgDraw()}else if(e.target.id==='bgr'){setBg(null);bgDraw()}});
$('#pbg').addEventListener('input',e=>{if(e.target.id==='bgi')setBg(e.target.value)});
(()=>{const tl=$('#tools');let h;addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const near=((S.lay||{}).t==='r'?innerWidth-e.clientX:e.clientX)<(tl.classList.contains('show')?120:40),keep=['psh','psh2','ptx'].some(i=>open(i));clearTimeout(h);if(near||keep)tl.classList.add('show');else h=setTimeout(()=>tl.classList.remove('show'),250)});document.documentElement.addEventListener('mouseleave',()=>tl.classList.remove('show'))})();
/* ---------- boot ---------- */
(async()=>{const d=await kvGet('doc');
  load(d||{texts:[{x:60,y:130,w:470,h:300,fs:20,font:0,color:'auto',al:1,mode:'md',text:'# Welcome to Slate\n\n**Select**: drag things to move them, double-tap a box to edit it.\n\n**Text**: drag to draw a box, then pick Text, Code or Markdown. Math works too: $E=mc^2$\n\nThe canvas never ends.'}]});
  resize();sync();setView();navigator.storage?.persist?.()})();
