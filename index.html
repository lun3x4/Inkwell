<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2436">
<title>Inkwell</title>
<style>
:root{--paper:#EDE8D0;--pl:#2a4a7a66;--ui:#F6F2E0;--bd:#cfc8aa;--fg:#2b2820;--txt:#1d1b16}
:root[data-theme=dark]{--paper:#161513;--pl:#ffffff3a;--ui:#22201c;--bd:#3b3830;--fg:#ece7d6;--txt:#efe9d8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper);color:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#layer{position:fixed;left:0;top:0;transform-origin:0 0;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;display:block}
.on .ic{fill:currentColor}
#top{position:fixed;left:0;right:0;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(46px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;background:var(--ui);border-bottom:1px solid var(--bd)}
#brand{font:italic 700 22px Georgia,serif}
.grp{display:flex;gap:2px}.grp:last-child{justify-self:end}
#top button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.panel{position:fixed;z-index:10;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--ui);border:1px solid var(--bd);box-shadow:0 4px 18px #0002;top:50%;transform:translateY(-50%)}
#tools{left:0;border-left:0;border-radius:0 24px 24px 0}
#side{right:12px;border-radius:26px}
.panel button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
body:not(.text) .txt{display:none}
.dot{display:block;width:28px;height:28px;border-radius:50%;border:2px solid var(--fg);--u:8px}
.pop{position:fixed;z-index:20;display:none;background:var(--ui);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:0 6px 24px #0003}
.pop.open{display:block}
#sw{display:grid;grid-template-columns:repeat(10,26px);gap:6px}
.swb{width:26px;height:26px;border-radius:50%;border:1px solid #0004!important}
.swb.on{outline:2px solid var(--fg);outline-offset:2px}
#wh{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
#wheel{width:150px;height:150px;touch-action:none;cursor:crosshair}
#val{width:200px;accent-color:var(--fg)}
#psz{display:none;align-items:center;gap:6px}#psz.open{display:flex}
#psz button{width:44px;height:44px;border-radius:50%;font-size:24px;border:1px solid var(--bd)}
#sv{min-width:64px;text-align:center;font-size:18px}
#pf{padding:6px}#pf button{display:block;width:140px;padding:10px 14px;border-radius:10px;text-align:left;font-size:20px}
#pf button.on{background:var(--bd)}
#pp,#psh{grid-template-columns:repeat(2,auto);gap:10px}#pp.open,#psh.open{display:grid}
#psh button{width:64px;height:64px;border-radius:14px;display:grid;place-items:center}
#psh button.on{background:var(--bd)}#psh .ic{width:30px;height:30px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:12px}
.tile.on{outline:2px solid var(--fg)}
.tile i{display:block;width:104px;height:72px;border-radius:8px;border:1px solid var(--bd);--u:14px}
.tile span{font-size:12px}
.pp,.tile i{background-color:var(--paper)}
.p-paper,.p-paperL{background-image:linear-gradient(var(--pl) 1px,transparent 1px)}
.p-paper{background-size:100% var(--u)}.p-paperL{background-size:100% calc(var(--u)*2)}
.p-grid,.p-gridL{background-image:linear-gradient(var(--pl) 1px,transparent 1px),linear-gradient(90deg,var(--pl) 1px,transparent 1px)}
.p-grid{background-size:var(--u) var(--u)}.p-gridL{background-size:calc(var(--u)*2) calc(var(--u)*2)}
.p-dots{background-image:radial-gradient(var(--pl) 1.4px,transparent 1.6px);background-size:var(--u) var(--u)}
#zc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px}
#zl{opacity:0;transition:opacity .25s;background:var(--ui);border:1px solid var(--bd);border-radius:12px;padding:3px 12px;font-variant-numeric:tabular-nums}
#zl.show{opacity:1}
#zt{position:relative;width:min(280px,60vw);height:40px;border-radius:20px;background:var(--ui);border:1px solid var(--bd);touch-action:none;cursor:ew-resize}
#zt::before{content:"";position:absolute;left:18px;right:18px;top:50%;height:2px;margin-top:-1px;background:var(--bd)}
#zk{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--fg)}

:root{--acc:#e0562d}
body.select #cv{cursor:default}
body.select #bs{display:none}
.note{position:absolute;display:flex;flex-direction:column;border:1.5px dashed transparent;border-radius:0;overflow:hidden;pointer-events:none}
body.text .note,.note.editing{pointer-events:auto;border-color:var(--acc)}
.note.mv{border-style:solid;border-color:var(--acc);box-shadow:0 6px 20px #0003}
.body{flex:1;padding:6px 8px;outline:none;overflow:hidden;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4;caret-color:var(--acc);-webkit-user-select:text;user-select:text}
.body::selection{background:color-mix(in srgb,var(--acc) 35%,transparent);color:inherit}
.rz{display:none;position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--acc) 50%)}
body.text .rz,.note.editing .rz{display:block}
#sv{width:84px;height:44px;text-align:center;font-size:18px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--fg);-webkit-user-select:text;user-select:text;-moz-appearance:textfield}
#sv::-webkit-inner-spin-button{display:none}
#fname{width:min(260px,60vw);height:38px;text-align:center;border-radius:19px;background:var(--ui);border:1px solid var(--bd);color:var(--fg);font:inherit;outline:none;-webkit-user-select:text;user-select:text}
#fname:focus{border-color:var(--acc)}
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#0006}
#modal[hidden]{display:none}
.card{background:var(--ui);border:1px solid var(--bd);border-radius:20px;padding:18px 20px;width:min(440px,92vw);box-shadow:0 10px 40px #0005}
.mh{display:flex;justify-content:space-between;align-items:center;font-size:20px;margin-bottom:8px}
.mh button{width:40px;height:40px;font-size:26px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:16px}
#asw{display:grid;grid-template-columns:repeat(10,26px);gap:6px;margin-bottom:8px}
input[type=checkbox]{accent-color:var(--acc);width:22px;height:22px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-sel" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
<symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></symbol>
<symbol id="i-hl" viewBox="0 0 24 24"><path d="M14 4l6 6-8 8H8l-3-3v-4z"/><path d="M4 21h16" fill="none"/></symbol>
<symbol id="i-er" viewBox="0 0 24 24"><rect x="3" y="8.5" width="18" height="8" rx="2" transform="rotate(-40 12 12.5)"/></symbol>
<symbol id="i-text" viewBox="0 0 24 24"><path d="M5 5h14v4h-2V7h-4v10h2v2H9v-2h2V7H7v2H5z"/></symbol>
<symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19L19 5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></symbol>
<symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></symbol>
<symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6.5"/></symbol>
<symbol id="i-tri" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/></symbol>
<symbol id="i-dia" viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h9a6 6 0 0 1 0 12h-3"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9h-9a6 6 0 0 0 0 12h3"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></symbol>
</defs></svg>
<canvas id="cv"></canvas>
<div id="layer"></div>
<header id="top">
  <span id="brand">Inkwell</span>
  <div class="grp"><button id="un" aria-label="Undo"><svg class="ic"><use href="#i-undo"/></svg></button><button id="re" aria-label="Redo"><svg class="ic"><use href="#i-redo"/></svg></button><button id="home" aria-label="Recenter"><svg class="ic"><use href="#i-home"/></svg></button></div>
  <div class="grp"><button id="st" aria-label="Settings"><svg class="ic"><use href="#i-set"/></svg></button><button id="ex" aria-label="Export"><svg class="ic"><use href="#i-down"/></svg></button><button id="im" aria-label="Import"><svg class="ic"><use href="#i-up"/></svg></button></div>
  <input type="file" id="file" accept=".json" hidden>
</header>
<nav id="tools" class="panel" aria-label="Tools">
  <button data-t="select" aria-label="Select"><svg class="ic"><use href="#i-sel"/></svg></button>
  <button data-t="pen" aria-label="Pen"><svg class="ic"><use href="#i-pen"/></svg></button>
  <button data-t="hl" aria-label="Highlighter"><svg class="ic"><use href="#i-hl"/></svg></button>
  <button data-t="er" aria-label="Eraser"><svg class="ic"><use href="#i-er"/></svg></button>
  <button data-t="text" aria-label="Text"><svg class="ic"><use href="#i-text"/></svg></button>
  <button data-t="shape" aria-label="Shape"><svg class="ic"><use id="shapeuse" href="#i-rect"/></svg></button>
</nav>
<div id="side" class="panel">
  <button id="bc" aria-label="Color"><i class="dot"></i></button>
  <button id="bs" aria-label="Size"></button>
  <button id="bf" class="txt" aria-label="Font">Aa</button>
  <button id="bp" aria-label="Paper"><i class="dot pp"></i></button>
  <button id="bm" aria-label="Light or dark mode"></button>
</div>
<div id="pc" class="pop"><div id="sw"></div><div id="wh"><canvas id="wheel" width="150" height="150"></canvas><input type="range" id="val" min="0" max="100" value="100" aria-label="Brightness"></div></div>
<div id="psz" class="pop"><button id="sm" aria-label="Smaller">−</button><input id="sv" type="number" min="10" max="110" inputmode="numeric" aria-label="Size value"><button id="sp" aria-label="Larger">+</button></div>
<div id="pf" class="pop"></div>
<div id="pp" class="pop"></div>
<div id="psh" class="pop"></div>
<div id="zc"><div id="zl">100%</div><input id="fname" placeholder="Untitled" maxlength="60" autocomplete="off" spellcheck="false" aria-label="File name"></div>
<div id="modal" hidden><div class="card"><div class="mh"><b>Settings</b><button id="mx" aria-label="Close">×</button></div>
<div class="row"><span>Accent color</span></div><div id="asw"></div>
<label class="row"><span>Pressure sensitivity</span><input type="checkbox" data-o="pressure"></label>
<label class="row"><span>Palm rejection</span><input type="checkbox" data-o="palm"></label>
<label class="row"><span>Auto-close brackets</span><input type="checkbox" data-o="pair"></label></div></div>
<script>
const $=s=>document.querySelector(s), cv=$('#cv'), ctx=cv.getContext('2d'), layer=$('#layer');
let S={opt:{pressure:1,palm:1,pair:0},accent:'#e0562d',name:'',strokes:[],texts:[],view:{x:0,y:0,z:1},bg:'paper',theme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'};
let tool='select',color='auto',size=3,undo=[],redo=[],dirty=true,cur=null,pan=null,erased=null,g=null,space=false,lastPen=0;
const ptrs=new Map(), PAL=['auto','#d33a2c','#e08a1e','#2f8f4e','#2f6fd0','#7a3fb5'];

/* ---------- storage (IndexedDB) ---------- */
const db=new Promise((res,rej)=>{const r=indexedDB.open('inkwell',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=k=>db.then(d=>new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})).catch(()=>{});
const kvSet=(k,v)=>db.then(d=>d.transaction('kv','readwrite').objectStore('kv').put(v,k)).catch(()=>{});
let st;const save=()=>{clearTimeout(st);st=setTimeout(()=>kvSet('doc',S),400)};

/* ---------- view ---------- */
const V=()=>S.view;
function setView(){const{x,y,z}=V();layer.style.transform=`translate(${x}px,${y}px) scale(${z})`;$('#zl').textContent=Math.round(z*100)+'%';if(lz!==null&&z!==lz)zshow();lz=z;dirty=true;save()}
function zoomAt(px,py,f){const v=V(),nz=Math.min(8,Math.max(.1,v.z*f)),k=nz/v.z;v.x=px-(px-v.x)*k;v.y=py-(py-v.y)*k;v.z=nz}
function resize(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;dirty=true}

/* ---------- drawing ---------- */
const dark=()=>S.theme==='dark', ink=s=>s.color==='auto'?(s.tool==='hl'?'#ffe14d':dark()?'#f2efe6':'#1b1b1b'):s.color;
function seg(s,i){const p=s.pts;ctx.lineWidth=s.size*(.4+1.2*p[i][2]);ctx.beginPath();ctx.moveTo(p[i-1][0],p[i-1][1]);ctx.lineTo(p[i][0],p[i][1]);ctx.stroke()}
function drawStroke(s){const p=s.pts;ctx.lineCap=ctx.lineJoin='round';ctx.strokeStyle=ink(s);
  if(s.tool==='shape'){ctx.lineWidth=s.size;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();return}
  if(s.tool==='hl'){ctx.globalAlpha=.4;ctx.lineWidth=s.size*5;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);p.forEach(q=>ctx.lineTo(q[0],q[1]));if(p.length==1)ctx.lineTo(p[0][0]+.01,p[0][1]);ctx.stroke();ctx.globalAlpha=1;return}
  if(p.length==1){ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.arc(p[0][0],p[0][1],s.size*.6,0,7);ctx.fill();return}
  for(let i=1;i<p.length;i++)seg(s,i)}
function render(){dirty=false;const d=devicePixelRatio||1,{x,y,z}=V(),W=innerWidth,H=innerHeight,k=dark();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=k?'#161513':'#EDE8D0';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(d,0,0,d,0,0);
  const kd=S.bg.replace('L',''),LG=S.bg.endsWith('L');if(S.bg!=='plain'){let s=LG?64:32;while(s*z<14)s*=2;const lc=k?'#ffffff':'#2a4a7a',x0=Math.floor(-x/z/s),y0=Math.floor(-y/z/s),x1=(W-x)/z,y1=(H-y)/z;
    if(kd==='dots'){ctx.fillStyle=lc;ctx.globalAlpha=.4;for(let i=x0;i*s<x1;i++)for(let j=y0;j*s<y1;j++)ctx.fillRect(i*s*z+x-1,j*s*z+y-1,2,2);ctx.globalAlpha=1}
    else{ctx.strokeStyle=lc;ctx.lineWidth=1;
      for(let j=y0;j*s<y1;j++){ctx.globalAlpha=kd==='grid'&&j%5==0?.28:.16;const sy=Math.round(j*s*z+y)+.5;ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke()}
      if(kd==='grid')for(let i=x0;i*s<x1;i++){ctx.globalAlpha=i%5==0?.28:.16;const sx=Math.round(i*s*z+x)+.5;ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke()}
      ctx.globalAlpha=1}}
  ctx.setTransform(d*z,0,0,d*z,x*d,y*d);
  const vx0=-x/z,vy0=-y/z,vx1=(W-x)/z,vy1=(H-y)/z;
  for(const s of S.strokes){const b=s.bb;if(b&&(b[2]<vx0||b[0]>vx1||b[3]<vy0||b[1]>vy1))continue;drawStroke(s)}}
const bbox=s=>{const m=s.size*3;let a=1e9,b=1e9,c=-1e9,e=-1e9;for(const p of s.pts){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);e=Math.max(e,p[1])}return[a-m,b-m,c+m,e+m]};
const world=e=>[(e.clientX-V().x)/V().z,(e.clientY-V().y)/V().z];
const pt=e=>{const[w,h]=world(e);return[Math.round(w*10)/10,Math.round(h*10)/10,S.opt.pressure?(e.pressure||.5):.5]};

/* ---------- touch pan / pinch ---------- */
const touches=()=>[...ptrs.values()].filter(p=>p.t==='touch');
const cen=t=>({x:t.reduce((a,p)=>a+p.x,0)/t.length,y:t.reduce((a,p)=>a+p.y,0)/t.length});
const dist=t=>t.length>1?Math.hypot(t[0].x-t[1].x,t[0].y-t[1].y):0;
function gstart(){const t=touches();if(!t.length){g=null;return}g={...cen(t),d:dist(t)}}

/* ---------- pointer input ---------- */
function eraseAt(e){const[wx,wy]=world(e),r=SZ.er/2/V().z,keep=[];
  for(const s of S.strokes){const b=s.bb;let hit=false;
    if(!b||(wx>b[0]-r&&wx<b[2]+r&&wy>b[1]-r&&wy<b[3]+r))hit=s.pts.some(p=>Math.abs(p[0]-wx)<r&&Math.abs(p[1]-wy)<r&&Math.hypot(p[0]-wx,p[1]-wy)<r);
    hit?erased.push(s):keep.push(s)}
  if(keep.length!==S.strokes.length){S.strokes=keep;dirty=true}}
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='pen')lastPen=performance.now();
  if(e.pointerType==='touch'&&(cur||(S.opt.palm&&performance.now()-lastPen<800)))return; // palm rejection
  cv.setPointerCapture(e.pointerId);
  const p={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t0:performance.now(),t:e.pointerType};ptrs.set(e.pointerId,p);
  if(e.pointerType==='touch'){if(touches().length>1)for(const q of ptrs.values())q.multi=1;if(tool==='select'&&touches().length===1)selDown(e,p);gstart();return}
  if(e.button===1||tool==='hand'||space){pan={x:e.clientX,y:e.clientY};document.body.style.cursor='grabbing';return}
  if(e.button!==0&&e.pointerType==='mouse')return;
  if(tool==='select'){selDown(e,p);pan={x:e.clientX,y:e.clientY};return}
  if(tool==='pen'||tool==='hl'||tool==='shape'){cur={tool,color,size:SZ[tool]/5,pts:[pt(e)]};if(tool==='shape'){cur.kind=shapeKind;cur.a=world(e)}S.strokes.push(cur);if(tool==='pen'){drawStroke(cur)}else dirty=true;
    ctx.setTransform((devicePixelRatio||1)*V().z,0,0,(devicePixelRatio||1)*V().z,V().x*(devicePixelRatio||1),V().y*(devicePixelRatio||1))}
  else if(tool==='er'){erased=[];eraseAt(e)}
  else if(tool==='text'){e.preventDefault();const a=world(e);tbox={a,...addText(a[0],a[1],0,0,false)}}
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='pen')lastPen=performance.now();
  const p=ptrs.get(e.pointerId);if(!p)return;
  if(p.t==='touch'){p.x=e.clientX;p.y=e.clientY;if(!g)return;const t=touches(),c=cen(t),d=dist(t);
    if(nd){moveNote(c.x-g.x,c.y-g.y);g={...c,d:0};return}
    if(tool==='select'&&p.n&&!p.drift&&t.length===1){if(Math.hypot(p.x-p.x0,p.y-p.y0)<8)return;p.drift=1;clearTimeout(lp)}
    V().x+=c.x-g.x;V().y+=c.y-g.y;if(t.length>1&&g.d)zoomAt(c.x,c.y,d/g.d);g={...c,d};setView();return}
  if(tbox){const[x,y]=world(e),t=tbox.t;t.x=Math.min(tbox.a[0],x);t.y=Math.min(tbox.a[1],y);t.w=Math.abs(x-tbox.a[0]);t.h=Math.abs(y-tbox.a[1]);place(t);return}
  if(pan){const dx=e.clientX-pan.x,dy=e.clientY-pan.y;
    if(nd)moveNote(dx,dy);else{if(p.n&&!p.drift){if(Math.hypot(e.clientX-p.x0,e.clientY-p.y0)<8)return;p.drift=1;clearTimeout(lp)}V().x+=dx;V().y+=dy;setView()}
    pan={x:e.clientX,y:e.clientY};return}
  if(cur){if(cur.tool==='shape'){cur.pts=outline(cur.kind,cur.a,world(e));dirty=true;return}for(const ev of(e.getCoalescedEvents?.()||[e])){cur.pts.push(pt(ev));if(cur.tool==='pen')seg(cur,cur.pts.length-1);else dirty=true}return}
  if(erased)eraseAt(e)});
function end(e){const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);selUp(e,p);
  if(p.t==='touch'){if(tool==='text'&&!p.multi&&e.type==='pointerup'&&Math.hypot(e.clientX-p.x0,e.clientY-p.y0)<8&&performance.now()-p.t0<400)addText(...world(e));gstart();return}
  if(tbox){const{t,b}=tbox;tbox=null;if(t.w<24||t.h<24){t.w=260;t.h=80}place(t);save();setTimeout(()=>b.focus(),30);return}
  if(pan){pan=null;document.body.style.cursor='';return}
  if(cur){if(cur.pts.length>(cur.tool==='shape'?1:0)){cur.bb=bbox(cur);undo.push({t:'add',s:cur});redo=[]}else S.strokes=S.strokes.filter(x=>x!==cur);cur=null;dirty=true;save()}
  if(erased){if(erased.length){undo.push({t:'del',s:erased});redo=[]}erased=null;save()}}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();
  if(e.ctrlKey||e.metaKey||e.deltaMode===1||(e.deltaX===0&&Math.abs(e.deltaY)>=100))zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)));
  else{V().x-=e.deltaX;V().y-=e.deltaY}setView()},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- undo / redo ---------- */
function apply(a,rev){const add=(a.t==='add')!==rev;if(add)S.strokes.push(...[].concat(a.s));else{const r=[].concat(a.s);S.strokes=S.strokes.filter(s=>!r.includes(s))}dirty=true;save()}
const doUndo=()=>{const a=undo.pop();if(a){apply(a,true);redo.push(a)}};
const doRedo=()=>{const a=redo.pop();if(a){apply(a,false);undo.push(a)}};

/* ---------- typed notes ---------- */
const FONTS=['Georgia,"Iowan Old Style",serif','system-ui,-apple-system,"Segoe UI",sans-serif','ui-monospace,Menlo,Consolas,monospace','"Bradley Hand","Segoe Script","Comic Sans MS","Marker Felt",cursive'],FN=['Serif','Sans','Mono','Hand'];
const SHAPES=['line','arrow','rect','ellipse','tri','dia'],PAPERS=[['paper','Ruled'],['paperL','Wide ruled'],['grid','Grid'],['gridL','Large grid'],['dots','Dots'],['plain','Plain']];
const PAIRS={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`','<':'>'},EL=new WeakMap();
let SZ={pen:15,hl:20,er:30,shape:10,text:22},fi=0,shapeKind='rect',act=null,tbox=null,nd=null,lp=null,lastTap=null,lz=null,zT;
const cs=()=>SZ[tool in SZ?tool:'pen'];
function outline(k,a,b){const[x0,y0]=a,[x1,y1]=b,mx=(x0+x1)/2,my=(y0+y1)/2;let v;
  if(k==='line')v=[a,b];
  else if(k==='arrow'){const t=Math.atan2(y1-y0,x1-x0),h=Math.min(28,Math.hypot(x1-x0,y1-y0)*.4);v=[a,b,[x1-h*Math.cos(t-.5),y1-h*Math.sin(t-.5)],b,[x1-h*Math.cos(t+.5),y1-h*Math.sin(t+.5)]]}
  else if(k==='rect')v=[a,[x1,y0],b,[x0,y1],a];
  else if(k==='tri')v=[[mx,y0],[x1,y1],[x0,y1],[mx,y0]];
  else if(k==='dia')v=[[mx,y0],[x1,my],[mx,y1],[x0,my],[mx,y0]];
  else{v=[];for(let i=0;i<=96;i++){const t=i/96*Math.PI*2;v.push([mx+Math.cos(t)*(x1-x0)/2,my+Math.sin(t)*(y1-y0)/2])}}
  const o=[];v.forEach((p,i)=>{if(i){const q=v[i-1],n=Math.ceil(Math.hypot(p[0]-q[0],p[1]-q[1])/8);for(let j=1;j<n;j++)o.push([q[0]+(p[0]-q[0])*j/n,q[1]+(p[1]-q[1])*j/n,.5])}o.push([p[0],p[1],.5])});return o}
function styleNote(t,b){b.style.fontSize=(t.fs||22)+'px';b.style.fontFamily=FONTS[t.font||0];b.style.color=t.color&&t.color!=='auto'?t.color:'var(--txt)'}
const place=t=>{EL.get(t).style.cssText=`left:${t.x}px;top:${t.y}px;width:${t.w}px;height:${t.h}px`};
function mkNote(t){const n=document.createElement('div');n.className='note';
  n.innerHTML='<div class="body" contenteditable="plaintext-only" spellcheck="false" autocorrect="off" autocapitalize="off"></div><i class="rz"></i>';
  EL.set(t,n);place(t);
  const b=n.querySelector('.body'),rz=n.querySelector('.rz');
  b.textContent=t.text;styleNote(t,b);
  b.oninput=()=>{t.text=b.innerText;save()};
  b.onfocus=()=>{act={t,b};n.classList.add('editing');if(t.fs){SZ.text=t.fs;fi=t.font||0}sync()};
  b.onblur=()=>{n.classList.remove('editing');if(!b.innerText.trim()){if(act&&act.t===t)act=null;S.texts=S.texts.filter(x=>x!==t);n.remove();save()}};
  b.onkeydown=e=>{if(e.key==='Escape'){b.blur();return}
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'\t');return}
    const c=PAIRS[e.key];if(!c)return;const sel=getSelection();
    if(!sel.isCollapsed){e.preventDefault();const tx=sel.toString();document.execCommand('insertText',false,e.key+tx+c);
      sel.modify('move','backward','character');for(let i=0;i<tx.length;i++)sel.modify('extend','backward','character')}
    else if(S.opt.pair&&'([{"`'.includes(e.key)){e.preventDefault();document.execCommand('insertText',false,e.key+c);sel.modify('move','backward','character')}};
  let d=null;rz.onpointerdown=e=>{e.stopPropagation();rz.setPointerCapture(e.pointerId);d={x:e.clientX,y:e.clientY}};
  rz.onpointermove=e=>{if(!d)return;t.w=Math.max(40,t.w+(e.clientX-d.x)/V().z);t.h=Math.max(30,t.h+(e.clientY-d.y)/V().z);d={x:e.clientX,y:e.clientY};place(t)};
  rz.onpointerup=()=>{d=null;save()};
  layer.appendChild(n);return b}
function addText(x,y,w=260,h=80,focus=true){const t={x:Math.round(x),y:Math.round(y),w,h,text:'',fs:SZ.text,font:fi,color};S.texts.push(t);const b=mkNote(t);if(focus)setTimeout(()=>b.focus(),30);return{t,b}}
function applyText(){if(act){act.t.fs=SZ.text;act.t.font=fi;act.t.color=color;styleNote(act.t,act.b);save()}}

/* select mode: pan, long-press to move a note, double-tap to edit */
const noteAt=(x,y)=>{for(let i=S.texts.length-1;i>=0;i--){const t=S.texts[i];if(x>=t.x&&x<=t.x+t.w&&y>=t.y&&y<=t.y+t.h)return t}return null};
function selDown(e,p){p.n=noteAt(...world(e));clearTimeout(lp);
  if(p.n)lp=setTimeout(()=>{if(ptrs.get(e.pointerId)===p&&!p.multi&&!p.drift){nd={t:p.n};EL.get(p.n).classList.add('mv');navigator.vibrate?.(15)}},450)}
function moveNote(dx,dy){nd.t.x+=dx/V().z;nd.t.y+=dy/V().z;place(nd.t)}
function selUp(e,p){clearTimeout(lp);
  if(nd){EL.get(nd.t).classList.remove('mv');nd=null;save();return}
  if(tool!=='select'||!p.n||p.drift||p.multi||e.type!=='pointerup'||performance.now()-p.t0>350)return;
  const now=performance.now();if(lastTap&&lastTap.t===p.n&&now-lastTap.at<400){editNote(p.n,e);lastTap=null}else lastTap={t:p.n,at:now}}
function editNote(t,e){const b=EL.get(t).querySelector('.body');EL.get(t).classList.add('editing');b.focus();
  let r=document.caretRangeFromPoint?.(e.clientX,e.clientY);
  if(!r&&document.caretPositionFromPoint){const c=document.caretPositionFromPoint(e.clientX,e.clientY);if(c){r=document.createRange();r.setStart(c.offsetNode,c.offset)}}
  const s=getSelection();s.removeAllRanges();
  if(r&&b.contains(r.startContainer)){r.collapse(true);s.addRange(r)}else{r=document.createRange();r.selectNodeContents(b);r.collapse(false);s.addRange(r)}}

/* ---------- UI ---------- */
const ic=(n)=>`<svg class="ic"><use href="#i-${n}"/></svg>`, col=c=>c==='auto'?'conic-gradient(#111 50%,#f2efe6 0)':c;
const title=()=>document.title=(S.name?S.name+' – ':'')+'Inkwell';
const zshow=()=>{$('#zl').classList.add('show');clearTimeout(zT);zT=setTimeout(()=>$('#zl').classList.remove('show'),1000)};
function sync(){document.documentElement.dataset.theme=S.theme;document.documentElement.style.setProperty('--acc',S.accent);document.body.className=tool;
  const on=(sel,key,val)=>document.querySelectorAll(sel).forEach(b=>b.classList.toggle('on',b.dataset[key]==val));
  on('[data-t]','t',tool);on('[data-k]','k',shapeKind);on('[data-p]','p',S.bg);on('[data-f]','f',fi);on('[data-c]','c',color);on('[data-a]','a',S.accent);
  $('#shapeuse').setAttribute('href','#i-'+shapeKind);
  $('#bc i').style.background=col(color);$('#bp i').className='dot pp p-'+S.bg;
  $('#bm').innerHTML=ic(dark()?'moon':'sun');
  $('#sv').value=cs();$('#bs').textContent=cs();$('#bf').style.fontFamily=FONTS[fi];dirty=true}
const closeAll=()=>document.querySelectorAll('.pop').forEach(p=>p.classList.remove('open'));
function pop(id,btn,side){const p=$('#'+id),was=p.classList.contains('open');closeAll();if(was)return;p.classList.add('open');
  const r=btn.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;
  p.style.left=Math.max(8,side==='r'?r.right+10:r.left-10-w)+'px';p.style.top=Math.max(56,Math.min(r.top+r.height/2-h/2,innerHeight-h-70))+'px'}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.pop,.panel'))closeAll()});

document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const was=tool==='shape'&&b.dataset.t==='shape'&&$('#psh').classList.contains('open');tool=b.dataset.t;closeAll();sync();if(tool==='shape'&&!was)pop('psh',b,'r')});
$('#psh').innerHTML=SHAPES.map(k=>`<button data-k="${k}" aria-label="${k}">${ic(k)}</button>`).join('');
$('#psh').onclick=e=>{const b=e.target.closest('[data-k]');if(b){shapeKind=b.dataset.k;tool='shape';closeAll();sync()}};
$('#pp').innerHTML=PAPERS.map(([k,n])=>`<button class="tile" data-p="${k}"><i class="p-${k}"></i><span>${n}</span></button>`).join('');
$('#pp').onclick=e=>{const b=e.target.closest('[data-p]');if(b){S.bg=b.dataset.p;closeAll();sync();save()}};
$('#pf').innerHTML=FN.map((n,i)=>`<button data-f="${i}" style="font-family:${FONTS[i]}">${n}</button>`).join('');
$('#pf').onclick=e=>{const b=e.target.closest('[data-f]');if(b){fi=+b.dataset.f;closeAll();applyText();sync()}};
$('#bc').onclick=e=>pop('pc',e.currentTarget,'l');$('#bs').onclick=e=>pop('psz',e.currentTarget,'l');
$('#bf').onclick=e=>pop('pf',e.currentTarget,'l');$('#bp').onclick=e=>pop('pp',e.currentTarget,'l');
$('#bm').onclick=()=>{S.theme=dark()?'light':'dark';sync();save()};
function setSize(v){SZ[tool in SZ?tool:'pen']=Math.round(Math.min(110,Math.max(10,+v||10)));if(tool==='text')applyText();sync();save()}
const stp=()=>tool==='text'?2:5;$('#sm').onclick=()=>setSize(cs()-stp());$('#sp').onclick=()=>setSize(cs()+stp());
$('#sv').onchange=e=>setSize(e.target.value);$('#sv').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};

/* colors */
const SW=['auto','#ffffff','#d0d0d0','#a0a0a0','#707070','#404040','#000000','#8b5a2b','#c9a66b','#f5deb3'];
for(const l of[38,55,72])for(let h=0;h<360;h+=36)SW.push(`hsl(${h} 70% ${l}%)`);
$('#sw').innerHTML=SW.map(c=>`<button class="swb" data-c="${c}" aria-label="${c}" style="background:${col(c)}"></button>`).join('');
function setColor(c){color=c;if(tool==='er')tool='pen';if(tool==='text')applyText();sync()}
$('#sw').onclick=e=>{const b=e.target.closest('[data-c]');if(b)setColor(b.dataset.c)};
const hsv=[0,0,1],wc=$('#wheel'),wx=wc.getContext('2d');let wd=false;
const hs=(h,s,v)=>{const f=n=>{const k=(n+h/60)%6;return Math.round(255*(v-v*s*Math.max(0,Math.min(k,4-k,1))))};return[f(5),f(3),f(1)]};
const hex=()=>'#'+hs(...hsv).map(v=>v.toString(16).padStart(2,'0')).join('');
function drawWheel(){const n=wc.width,r=n/2,im=wx.createImageData(n,n);for(let y=0;y<n;y++)for(let x=0;x<n;x++){const dx=x-r,dy=y-r,d=Math.hypot(dx,dy);if(d>r)continue;im.data.set([...hs((Math.atan2(dy,dx)*180/Math.PI+360)%360,d/r,hsv[2]),255],(y*n+x)*4)}wx.putImageData(im,0,0)}
const pickW=e=>{const r=wc.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;hsv[0]=(Math.atan2(dy,dx)*180/Math.PI+360)%360;hsv[1]=Math.min(1,Math.hypot(dx,dy)/(r.width/2));setColor(hex())};
wc.onpointerdown=e=>{wc.setPointerCapture(e.pointerId);wd=true;pickW(e)};wc.onpointermove=e=>{if(wd)pickW(e)};wc.onpointerup=()=>wd=false;
$('#val').oninput=e=>{hsv[2]=e.target.value/100;drawWheel();setColor(hex())};drawWheel();

/* settings */
$('#asw').innerHTML=SW.slice(1).map(c=>`<button class="swb" data-a="${c}" aria-label="${c}" style="background:${c}"></button>`).join('');
$('#asw').onclick=e=>{const b=e.target.closest('[data-a]');if(b){S.accent=b.dataset.a;sync();save()}};
$('#st').onclick=()=>{closeAll();document.querySelectorAll('[data-o]').forEach(i=>i.checked=!!S.opt[i.dataset.o]);$('#modal').hidden=false};
$('#mx').onclick=()=>$('#modal').hidden=true;$('#modal').onclick=e=>{if(e.target.id==='modal')e.target.hidden=true};
document.querySelectorAll('[data-o]').forEach(i=>i.onchange=()=>{S.opt[i.dataset.o]=i.checked?1:0;save()});

/* top bar + file name */
$('#un').onclick=doUndo;$('#re').onclick=doRedo;
$('#home').onclick=()=>{Object.assign(V(),{x:0,y:0,z:1});setView()};
$('#fname').oninput=e=>{S.name=e.target.value;title();save()};
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=((S.name||'inkwell').replace(/[\\/:*?"<>|]+/g,'-'))+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('#im').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!confirm('Replace the current canvas with this file?'))return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.strokes))throw 0;S=Object.assign(S,d);S.opt=Object.assign({pressure:1,palm:1,pair:0},S.opt);S.accent=S.accent||'#e0562d';layer.innerHTML='';S.texts.forEach(mkNote);$('#fname').value=S.name||'';title();undo=[];redo=[];act=null;sync();setView()}catch{alert('That file is not an Inkwell backup.')}};

addEventListener('keydown',e=>{if(e.target.isContentEditable||e.target.tagName==='INPUT')return;
  if(e.code==='Space'){space=true;e.preventDefault()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();doRedo()}});
addEventListener('keyup',e=>{if(e.code==='Space')space=false});
addEventListener('resize',resize);
(function loop(){if(dirty)render();requestAnimationFrame(loop)})();

/* ---------- boot ---------- */
(async()=>{const d=await kvGet('doc');
  if(d)S=Object.assign(S,d);
  else S.texts.push({x:60,y:130,w:420,h:330,text:'Welcome to Inkwell.\n\nSelect: drag to move around, double-tap a box to edit it, long-press to move it.\nText: drag to draw a box, then type.\n\nThe canvas never ends.',fs:22,font:0,color:'auto'});
  S.sz=SZ=Object.assign(SZ,S.sz);S.opt=Object.assign({pressure:1,palm:1,pair:0},S.opt);S.accent=S.accent||'#e0562d';$('#fname').value=S.name||'';title();S.texts.forEach(mkNote);resize();sync();setView();navigator.storage?.persist?.()})();
</script>
</body>
</html>
